# スキーマのSSOTはFlywayマイグレーション(db/migration)。Hibernateは検証のみ行う
spring:
  application:
    name: reservation-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
