# 会議室予約システム API仕様 — スライスRSV-C「予約を作成できる」
# ステータス: 承認済み(2026-07-13) — このファイルがスライスRSV-Cの正式な仕様。変更には再承認が必要
# 範囲: このスライスで使う操作だけを定義する。先のスライスの分は書かない
#
# ============================================================
# 3行でわかるこの契約
#   予約する:   POST /reservations に「誰が・どの部屋を・いつ・何人で」を送る
#   成功したら: 201 と、予約ID付きの予約内容が返る
#   拒否なら:   時間帯の重なりは409、それ以外のルール違反は422。どちらも理由コード+説明文が返る
#
# リクエスト例(会議室Aを7/14の10:00-11:00に4人で予約):
#   POST /reservations
#   { "roomId": "room-a", "employeeId": "emp-001", "date": "2026-07-14",
#     "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 成功レスポンス例(201):
#   { "reservationId": "rsv-123", "roomId": "room-a", "employeeId": "emp-001",
#     "date": "2026-07-14", "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 拒否レスポンス例(409):
#   { "code": "TIME_SLOT_CONFLICT", "message": "時間帯が既存の予約と重なっています" }
#
# 拒否理由コードとシナリオの対応:
#   TIME_SLOT_CONFLICT      … RSV-C-02(重なり) → 409
#   TOO_SHORT               … RSV-C-05(30分未満) → 422
#   INVALID_TIME_SLOT       … RSV-C-06/07(逆転・同一時刻) → 422
#   OUTSIDE_BUSINESS_HOURS  … RSV-C-08/09(営業時間外) → 422
#   EXCEEDS_CAPACITY        … RSV-C-10(定員超過) → 422
#   CROSSES_DAY_BOUNDARY    … RSV-C-11(日マタギ) → 422
# ============================================================
openapi: 3.0.3
info:
  title: 会議室予約システム API
  version: 0.1.0
paths:
  /reservations:
    post:
      operationId: createReservation
      summary: 予約を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              roomId: room-a
              employeeId: emp-001
              date: "2026-07-14"
              startTime: "10:00"
              endTime: "11:00"
              attendeeCount: 4
      responses:
        "201":
          description: 予約が作成された
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
              example:
                reservationId: rsv-123
                roomId: room-a
                employeeId: emp-001
                date: "2026-07-14"
                startTime: "10:00"
                endTime: "11:00"
                attendeeCount: 4
        "409":
          description: 時間帯が既存の予約と重なっている(室×時間帯の排他的占有に違反)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TIME_SLOT_CONFLICT
                message: 時間帯が既存の予約と重なっています
        "422":
          description: 予約単体のルール違反(30分未満・時刻の逆転/同一・日マタギ・営業時間外・定員超過)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TOO_SHORT
                message: 予約は30分以上でなければなりません
components:
  schemas:
    CreateReservationRequest:
      type: object
      required: [roomId, employeeId, date, startTime, endTime, attendeeCount]
      properties:
        roomId:
          type: string
          description: 会議室ID
        employeeId:
          type: string
          description: 予約する社員のID
        date:
          type: string
          format: date
          description: 予約日
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 開始時刻(その日の時刻)
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 終了時刻(その日の時刻)。時間帯は半開区間で、終了時刻ちょうどは占有に含まない
        attendeeCount:
          type: integer
          minimum: 1
          description: 利用人数
    ReservationResponse:
      type: object
      required: [reservationId, roomId, employeeId, date, startTime, endTime, attendeeCount]
      properties:
        reservationId:
          type: string
        roomId:
          type: string
        employeeId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendeeCount:
          type: integer
    ProblemResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            拒否理由コード。TIME_SLOT_CONFLICT(重なり) / TOO_SHORT(30分未満) /
            INVALID_TIME_SLOT(逆転・同一時刻) / CROSSES_DAY_BOUNDARY(日マタギ) /
            OUTSIDE_BUSINESS_HOURS(営業時間外) / EXCEEDS_CAPACITY(定員超過)
        message:
          type: string
          description: 人間が読める説明
