# 会議室予約システム API仕様 — スライスRSV-C「予約を作成できる」
# ステータス: 承認済み(2026-07-13) — このファイルがスライスRSV-Cの正式な仕様。変更には再承認が必要
# 改訂: 2026-07-14 CROSSES_DAY_BOUNDARYを削除。日マタギはスキーマ(単一date+時刻)が構造的に禁止(ADR-0004、人間承認済み)
# 改訂: 2026-07-15(承認済み) スライスRSV-K「予約をキャンセルできる」のキャンセル操作を追記(下記「RSV-K追記」ブロックと
#       paths./reservations/{reservationId}/cancel)。POST /reservationsを含む既存部分は無変更(ProblemResponse.code説明文への追記のみ人間承認済み)
# 改訂: 2026-07-16(承認済み) スライスRSV-A「空き枠を確認できる」のクエリ操作を追記(下記「RSV-A追記」ブロックと
#       paths./rooms/{roomId}/availability)。POST /reservations・POST /reservations/{reservationId}/cancelを含む
#       既存部分は無変更(ProblemResponse.code説明文へのROOM_NOT_FOUND追記のみ、人間承認済み)
# 改訂: 2026-07-17(承認済み) スライスRSV-R「会議室の予約ルールを確認できる」のクエリ操作を追記(下記「RSV-R追記」ブロックと
#       paths./rooms/{roomId}/rules)。POST /reservations・POST /reservations/{reservationId}/cancel・
#       GET /rooms/{roomId}/availabilityを含む既存部分は無変更。ROOM_NOT_FOUNDは既存コードを再利用し、
#       ProblemResponse.codeの説明文への追記は行わない(新規コードではないため)
# 改訂(承認済み: 2026-07-27) 2026-07-22 GET /roomsのAPI形状(会議室一覧取得)を追記(下記「RSV-L追記」ブロックと
#       paths./rooms)。POST /reservations・POST /reservations/{reservationId}/cancel・
#       GET /rooms/{roomId}/availability・GET /rooms/{roomId}/rulesを含む既存部分は無変更。新規の拒否理由コードは
#       無い(このクエリに拒否レスポンスが存在しないため、ProblemResponse.code説明文への追記も無い)。この改訂は
#       API形状のみを対象とし、受け入れシナリオ(一覧内容・name昇順・0件=空一覧)は断面②で実装スライスとして
#       reservation-rooms.feature(RSV-L-01/02)に起こした。詳細な裁定はadr/0007を参照。断面①(API形状)の承認材料は
#       reservation-frontend/design/reconciliation/rsv-l-room-list-ssot-reconciliation.md
# 改訂(承認待ち: ドラフト) 2026-08-01 POST /roomsのAPI形状(会議室登録)を追記(下記「RSV-T追記」ブロックと
#       paths./rooms post)。GET /rooms・POST /reservations・POST /reservations/{reservationId}/cancel・
#       GET /rooms/{roomId}/availability・GET /rooms/{roomId}/rulesを含む既存部分は無変更。新しい拒否理由コード
#       ROOM_NAME_DUPLICATE(409)・INVALID_BUSINESS_HOURS(422)をProblemResponse.code説明文に追記。受け入れ
#       シナリオはcontracts/reservation-room-registration.feature(RSV-T-01〜04)。詳細な裁定はadr/0008(ドラフト)を参照
# 範囲: このスライスで使う操作だけを定義する。先のスライスの分は書かない
#
# ============================================================
# 3行でわかるこの契約
#   予約する:   POST /reservations に「誰が・どの部屋を・いつ・何人で」を送る
#   成功したら: 201 と、予約ID付きの予約内容が返る
#   拒否なら:   時間帯の重なりは409、それ以外のルール違反は422。どちらも理由コード+説明文が返る
#
# リクエスト例(会議室Aを7/14の10:00-11:00に4人で予約):
#   POST /reservations
#   { "roomId": "room-a", "reserverId": "user-001", "date": "2026-07-14",
#     "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 成功レスポンス例(201):
#   { "reservationId": "rsv-123", "roomId": "room-a", "reserverId": "user-001",
#     "date": "2026-07-14", "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 拒否レスポンス例(409):
#   { "code": "TIME_SLOT_CONFLICT", "message": "時間帯が既存の予約と重なっています" }
#
# 拒否理由コードとシナリオの対応:
#   TIME_SLOT_CONFLICT      … RSV-C-02(重なり) → 409
#   TOO_SHORT               … RSV-C-05(30分未満) → 422
#   INVALID_TIME_SLOT       … RSV-C-06/07(逆転・同一時刻) → 422
#   OUTSIDE_BUSINESS_HOURS  … RSV-C-08/09(営業時間外) → 422
#   EXCEEDS_CAPACITY        … RSV-C-10(定員超過) → 422
# ============================================================
#
# ---- RSV-K「予約をキャンセルできる」追記(承認済み: 2026-07-15) ----
# 4行目の要約:
#   キャンセルする: POST /reservations/{reservationId}/cancel に「誰が」(reserverId)を送る。
#                   成功は200+キャンセル後の予約内容。本人以外は403、開始15分前を過ぎていたら422、
#                   既にキャンセル済みなら409、予約が存在しなければ404
#
# リクエスト例(佐藤が予約rsv-123をキャンセル):
#   POST /reservations/rsv-123/cancel
#   { "reserverId": "user-sato" }
#
# 成功レスポンス例(200):
#   { "reservationId": "rsv-123", "roomId": "room-a", "reserverId": "user-sato",
#     "date": "2026-07-14", "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4,
#     "cancelledAt": "2026-07-14T09:30:00+09:00" }
#
# 拒否レスポンス例(422、開始15分前を過ぎている場合):
#   { "code": "CANCEL_DEADLINE_PASSED", "message": "開始15分前を過ぎているためキャンセルできません" }
#
# 新しい拒否理由コードとシナリオの対応(このスライスの追加分):
#   NOT_RESERVER            … RSV-K-02(予約した本人ではない) → 403
#   CANCEL_DEADLINE_PASSED  … RSV-K-06/07(開始15分前を過ぎている) → 422
#   ALREADY_CANCELLED       … RSV-K-08(既にキャンセル済み) → 409
#   RESERVATION_NOT_FOUND   … RSV-K-09(予約が存在しない) → 404
#
# 裁定記録(2026-07-15人間裁定、詳細はprojects/reservation-system/adr/0005):
#   15分前ちょうどは可 / キャンセルは本人のみ(reserverId必須) / 二重キャンセルは409 /
#   成功は200+内容 / ProblemResponse.codeの説明文へ新コード追記(承認済みテキストの改訂を含む)
# ---- RSV-K追記ここまで ----
# ============================================================
#
# ---- RSV-A「空き枠を確認できる」追記(承認済み: 2026-07-16) ----
# 4行目の要約:
#   空き枠を確認する: GET /rooms/{roomId}/availability?date=YYYY-MM-DD を呼ぶ。
#                     成功は200+その日の空いている時間帯一覧(埋まっていれば0件もありうる)。
#                     部屋が存在しなければ404
#
# リクエスト例(会議室room-aの2026-07-14の空き枠を確認):
#   GET /rooms/room-a/availability?date=2026-07-14
#
# 成功レスポンス例(200、10:00-11:00が予約済みの場合):
#   { "roomId": "room-a", "date": "2026-07-14",
#     "availableSlots": [ { "startTime": "09:00", "endTime": "10:00" },
#                          { "startTime": "11:00", "endTime": "18:00" } ] }
#   全て埋まっている場合は "availableSlots": [] (空配列)
#   availableSlotsは「予約可能な空き」のみ。最小予約時間(30分)に満たない隙間は含まない(RSV-A-05、下記裁定)
#
# 拒否レスポンス例(404、部屋が存在しない場合):
#   { "code": "ROOM_NOT_FOUND", "message": "会議室が存在しません" }
#
# 新しい拒否理由コードとシナリオの対応(このスライスの追加分):
#   ROOM_NOT_FOUND          … RSV-A-07(会議室が存在しない) → 404
#
# 裁定記録(2026-07-16人間裁定、詳細はprojects/reservation-system/adr/0006):
#   availableSlotsは予約可能な空きのみを返す。最小予約時間(30分、RSV-C-05)未満の隙間は除外(RSV-A-05)
#
# 解釈ポイント(architectの判断。承認時に確認されたい。シナリオ側の解釈ポイントは
# contracts/reservation-availability.featureのヘッダも参照):
#   (1) このクエリは予約者の識別(reserverId等)を要求しない設計とした。空き状況の閲覧は
#       キャンセルのような資源保護の対象ではなく、公開情報として扱えると判断した
#       (ADR-0003の精神=予約者の資格・認証ルールを持たない、と整合)
#   (2) レスポンスは「空いている時間帯(availableSlots)」そのものを直接返す設計とした。
#       代替案(既存の予約=占有時間帯を返し、空き時間の計算をクライアントに委ねる)は不採用:
#       営業時間・重複判定というサーバ側の業務知識をクライアントと二重管理するリスクがあり、
#       業務文言「空き枠を確認できる」にも直接対応しない
#   (3) 1回のクエリの単位は「会議室1件×特定の1日」に限定した。複数会議室の一括確認・複数日
#       範囲確認はこのスライスでは扱わない(P-02: スライスに必要な分だけ)
#   (4) 部屋が存在しない場合のコードはROOM_NOT_FOUND。RSV-Cで実装判断として使われていた
#       (契約未定義)コード名(activeContext.md参照)を、このスライスで契約に格上げした
#   (5) availableSlotsは開始時刻の昇順で返る前提とした(スキーマのdescriptionに明記)。
#       これはシナリオのThen文が複数区間を順序付きで列挙している(RSV-A-02/03)ことと対応させるため
#
# ---- RSV-A追記ここまで ----
# ============================================================
#
# ---- RSV-R「会議室の予約ルールを確認できる」追記(承認済み: 2026-07-17) ----
# 4行目の要約:
#   予約ルールを確認する: GET /rooms/{roomId}/rules を呼ぶ。
#                         成功は200+その会議室の営業時間・定員・最小予約時間。部屋が存在しなければ404
#
# リクエスト例(会議室room-aの予約ルールを確認):
#   GET /rooms/room-a/rules
#
# 成功レスポンス例(200):
#   { "roomId": "room-a", "businessHoursStart": "09:00", "businessHoursEnd": "18:00",
#     "capacity": 6, "minReservationDurationMinutes": 30 }
#
# 拒否レスポンス例(404、部屋が存在しない場合):
#   { "code": "ROOM_NOT_FOUND", "message": "会議室が存在しません" }
#
# 拒否理由コードとシナリオの対応(このスライスの追加分。新規コードなし):
#   ROOM_NOT_FOUND          … RSV-R-03(会議室が存在しない) → 404(RSV-Aで定義済みのコードを再利用)
#
# 発端: ADR-0006の「帰結」に残された未解決の論点(最小予約時間の値をクライアントにどう見せるか)。
# 詳細はprojects/reservation-system/adr/0006-availability-returns-bookable-slots.md
#
# 解釈ポイント(architectの判断。承認時に確認されたい。シナリオ側の解釈ポイントは
# contracts/reservation-rules.featureのヘッダも参照):
#   (1) 公開する予約ルールは営業時間・定員・最小予約時間の3点に限定した(activeContext.mdの
#       次スライス候補の記述通り)。キャンセル期限(開始15分前)はこのスライスの発端に含まれて
#       おらず対象外とした(P-02)
#   (2) 3点を会議室1件あたりの単一クエリにまとめた(RSV-Aの空き枠確認と同型のGET /rooms/{roomId}/...
#       経路)。最小予約時間だけを会議室に依存しない別のエンドポイントに分離する代替案は不採用:
#       予約前の問い合わせが2回に増え、目的文「予約する前に知る」に対して回りくどいため
#   (3) minReservationDurationMinutesはシステム共通の1つの値であり、会議室ごとに異なる値を
#       持たない(RSV-R-02で異なる会議室に対して同じ値が返ることを確認する)
#   (4) このクエリも予約者の識別(reserverId等)を要求しない(RSV-A解釈ポイント(1)と同じ理由)
#   (5) ROOM_NOT_FOUNDはRSV-Aで定義済みの拒否理由コードをそのまま再利用する。ProblemResponse.code
#       の説明文(既存承認済みテキスト)への変更は行わない(新規コードではないため追記不要と判断)
#
# ---- RSV-R追記ここまで ----
# ============================================================
#
# ---- RSV-L「会議室の一覧を確認できる」追記(承認済み: 2026-07-27。API形状。受け入れシナリオはreservation-rooms.feature) ----
# 4行目の要約:
#   会議室の一覧を確認する: GET /rooms を呼ぶ。パスパラメータ・クエリパラメータは無い。
#                          成功は200+全会議室の一覧(0件なら空配列)。拒否レスポンスは無い
#
# リクエスト例(会議室の一覧を確認):
#   GET /rooms
#
# 成功レスポンス例(200、会議室が2件登録されている場合):
#   { "rooms": [
#       { "roomId": "room-a", "name": "会議室A", "businessHoursStart": "09:00", "businessHoursEnd": "18:00", "capacity": 6 },
#       { "roomId": "room-b", "name": "会議室B", "businessHoursStart": "08:00", "businessHoursEnd": "20:00", "capacity": 10 }
#     ] }
#   会議室が一件も登録されていない場合は "rooms": [] (空配列)
#
# 拒否理由コードとシナリオの対応: 無し。このクエリはパス・クエリパラメータを持たず、リクエストの
#   妥当性で失敗する経路が存在しない(RSV-A/RSV-RのroomId不正→404に相当する概念が無い)
#
# 発端: reservation-frontend側の設計突き合わせ(design/reconciliation/booking-design-reconciliation.md
# 項目1・7・19)で判明した未契約の必要性。人間が「reservation-systemに追加する・フロントの必要から
# 形を決める(consumer-driven contract)」ことを決定(2026-07-22)。詳細な裁定はadr/0007を参照
#
# 解釈ポイント(architectの判断。承認時に確認されたい。受け入れシナリオ(一覧内容・name昇順・0件=空一覧)は
# 本改訂の対象外とし、実装スライスでtesterがRSV-Lとして起こす。IDは予約(adr/0007を参照)):
#   (1) 一覧の各要素(RoomSummary)にはroomId・name・businessHoursStart/End・capacityを含め、
#       minReservationDurationMinutes(最小予約時間)は含めない。理由・代替案の検討はadr/0007を参照
#       (要旨: システム共通の単一値を一覧要素ごとに複製すると二重管理のリスクを生む。/rulesを
#       正とする)
#   (2) name(表示名)フィールドは新設ではない。design.mdのroomsテーブル・test-support-api.yamlの
#       RoomUpsertRequest/RoomResponseには2026-07-13時点から既に存在するが、公開APIのレスポンスに
#       含まれたことはこれまでなかった。本スライスで初めて公開する(adr/0007)
#   (3) レスポンスは配列を直接返さず、"rooms"キーを持つオブジェクト(RoomListResponse)でラップした。
#       既存の全レスポンス(ReservationResponse・AvailabilityResponse等)がオブジェクトである
#       パターンとの整合、および将来のページング・件数等のメタデータ追加への拡張余地のため
#       (現時点でページング・絞り込みクエリパラメータは持たない。P-02: 今必要な分だけ)
#   (4) 一覧の並び順はname(表示名)の昇順に固定した。roomIdはサーバ採番の不透明な識別子であり
#       (test-support-api.yamlのRoomResponse例「roomId: 5f3a…(サーバ採番)」)順序に業務的な意味を
#       持たせられない
#   (5) 会議室が0件の場合は200+空配列("rooms": [])を返す。404にはしない。一覧クエリ自体は成功して
#       おり、対象が0件であることと個々の会議室の不存在(ROOM_NOT_FOUND、RSV-A-07/RSV-R-03)は
#       別の意味論であるため
#   (6) このクエリも予約者の識別(reserverId等)を要求しない(RSV-A/RSV-R解釈ポイントと同じ理由。
#       ADR-0003の精神=閲覧は公開情報、と整合)
#   (7) クエリパラメータ(絞り込み)は現時点で持たない。少数の社内会議室を想定し全件を返せば足りる
#       (人間の想定)。将来会議室数が増えた場合の絞り込み・ページングは別スライスで再検討する(P-02)
#   (8) /rooms/{roomId}/rulesとの役割分担: /roomsは「一覧・存在の概要(表示・会議室選択用)」、
#       /rulesは「個別会議室の予約前詳細(最小予約時間を含む検証用)」。/rulesの契約(reservation-
#       rules.feature・本ファイルのRSV-R追記)は変更しない。役割分担の裁定はadr/0007を参照
#
# ---- RSV-L追記ここまで ----
# ============================================================
#
# ---- RSV-T「会議室を登録できる」追記(承認待ち: ドラフト。API形状。受け入れシナリオはreservation-room-registration.feature) ----
# 4行目の要約:
#   会議室を登録する: POST /rooms に「名前・営業時間・定員」を送る。
#                     成功は201+登録された会議室の概要(roomIdはサーバ採番)。表示名の重複は409、
#                     営業時間が成立しない(終了が開始以前)場合は422
#
# リクエスト例(会議室Cを09:00-18:00、定員8人で登録):
#   POST /rooms
#   { "name": "会議室C", "businessHoursStart": "09:00", "businessHoursEnd": "18:00", "capacity": 8 }
#
# 成功レスポンス例(201):
#   { "roomId": "room-c(サーバ採番)", "name": "会議室C", "businessHoursStart": "09:00",
#     "businessHoursEnd": "18:00", "capacity": 8 }
#
# 拒否レスポンス例(409、表示名が重複している場合):
#   { "code": "ROOM_NAME_DUPLICATE", "message": "同じ名前の会議室が既に存在します" }
#
# 拒否レスポンス例(422、営業時間が成立しない場合):
#   { "code": "INVALID_BUSINESS_HOURS", "message": "営業時間の終了時刻は開始時刻より後でなければなりません" }
#
# 新しい拒否理由コードとシナリオの対応(このスライスの追加分):
#   ROOM_NAME_DUPLICATE     … RSV-T-02(表示名の重複) → 409
#   INVALID_BUSINESS_HOURS  … RSV-T-03/04(営業時間が成立しない) → 422
#
# 発端: ローカルで予約システムとして一通り動くかを確かめようとしたところ、通常起動(acceptanceプロファイル
# 以外)では会議室を1件も作れないことが判明した(POST /test-support/roomsが@Profile("acceptance")限定・
# Flywayにseedなし・data.sql等の経路もなし)。人間が「会議室を登録する正式なAPIを足す」ことを決定
# (2026-08-01、dev用seedデータ・DB直接投入は不採用)。詳細な裁定はadr/0008(ドラフト)を参照
#
# 解釈ポイント(architectの判断。承認時に確認されたい。シナリオ側の解釈ポイントは
# contracts/reservation-room-registration.featureのヘッダも参照):
#   (1) roomIdはサーバ採番とし、リクエストボディに含めない。POST /reservationsがreservationIdを
#       サーバ採番する形、およびtest-supportのPOST /test-support/roomsが既に"サーバ採番"のroomIdを
#       応答している実績と整合させた(adr/0008決定1)
#   (2) 成功時の応答は新しいスキーマを作らず、既存のRoomSummary(RSV-L追記)をそのまま再利用する。
#       GET /roomsの一覧要素と、単体登録の結果は同じ形(roomId・name・businessHoursStart・
#       businessHoursEnd・capacity)で過不足がないため(adr/0008決定2)
#   (3) 表示名(name)の重複を409(ROOM_NAME_DUPLICATE)で拒否する。GET /rooms(RSV-L)がname昇順を
#       一覧の唯一の並び順基準としており(adr/0007決定4)、重複を許すと利用者が名前で会議室を
#       取り違える事故を招くため。既存のTIME_SLOT_CONFLICT(RSV-C、時間帯の重なり)と同種の「既存の
#       状態と衝突する」意味論のため409を用いた(adr/0008決定3)
#   (4) 営業時間の終了時刻が開始時刻より後でない場合を422(INVALID_BUSINESS_HOURS)で拒否する。
#       RSV-C-06/07(予約単体の時間帯の逆転・同一時刻をINVALID_TIME_SLOTで拒否)と同型の判断を、
#       会議室自身の営業時間という別の対象に適用したもの。対象が異なるため既存のINVALID_TIME_SLOT
#       コードは再利用せず、新設した(adr/0008決定4、検討した代替案A)
#   (5) 定員の下限(1人以上)は拒否理由コードを持つ業務ルールとしては表現しない。スキーマの
#       minimum: 1のみで表現する。CreateReservationRequest.attendeeCountの既存の扱い(同じ
#       minimum: 1を持つが対応する拒否シナリオを持たない)と揃えた(adr/0008決定5)
#   (6) 営業時間の幅が最小予約時間(30分)未満になる登録は拒否しない。空き枠確認(RSV-A)側の
#       「全て埋まっている」の意味論で吸収でき、会議室自身の設定として構造的に破綻しているわけでは
#       ないため(P-02、adr/0008決定6)
#   (7) 登録者の識別(reserverId相当)は要求しない。会議室管理者という主体の識別・権限モデルは
#       ワーク・既存契約のいずれにも存在せず、更新・削除(所有者チェックが必要になりうる操作)は
#       本スライスの範囲外のため、今は使い道がない(adr/0008決定7)
#
# ---- RSV-T追記ここまで ----
# ============================================================
openapi: 3.0.3
info:
  title: 会議室予約システム API
  version: 0.1.0
paths:
  /reservations:
    post:
      operationId: createReservation
      summary: 予約を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              roomId: room-a
              reserverId: user-001
              date: "2026-07-14"
              startTime: "10:00"
              endTime: "11:00"
              attendeeCount: 4
      responses:
        "201":
          description: 予約が作成された
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
              example:
                reservationId: rsv-123
                roomId: room-a
                reserverId: user-001
                date: "2026-07-14"
                startTime: "10:00"
                endTime: "11:00"
                attendeeCount: 4
        "409":
          description: 時間帯が既存の予約と重なっている(室×時間帯の排他的占有に違反)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TIME_SLOT_CONFLICT
                message: 時間帯が既存の予約と重なっています
        "422":
          description: 予約単体のルール違反(30分未満・時刻の逆転/同一・営業時間外・定員超過)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TOO_SHORT
                message: 予約は30分以上でなければなりません
  # ---- ここから RSV-K追記。上のPOST /reservationsは無変更 ----
  /reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      summary: 予約をキャンセルする(RSV-K追記)
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
          description: キャンセル対象の予約ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationRequest"
            example:
              reserverId: user-sato
      responses:
        "200":
          description: 予約がキャンセルされた(RSV-K-01/04/05)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelledReservationResponse"
              example:
                reservationId: rsv-123
                roomId: room-a
                reserverId: user-sato
                date: "2026-07-14"
                startTime: "10:00"
                endTime: "11:00"
                attendeeCount: 4
                cancelledAt: "2026-07-14T09:30:00+09:00"
        "403":
          description: 予約した本人ではない(RSV-K-02)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: NOT_RESERVER
                message: 予約した本人のみキャンセルできます
        "404":
          description: 予約が存在しない(RSV-K-09)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: RESERVATION_NOT_FOUND
                message: 予約が存在しません
        "409":
          description: 既にキャンセルされている(RSV-K-08)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ALREADY_CANCELLED
                message: この予約は既にキャンセルされています
        "422":
          description: 開始15分前を過ぎている(RSV-K-06/07)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: CANCEL_DEADLINE_PASSED
                message: 開始15分前を過ぎているためキャンセルできません
  # ---- RSV-K追記ここまで ----
  # ---- ここから RSV-A追記。上のPOST /reservationsおよびPOST /reservations/{reservationId}/cancelは無変更 ----
  /rooms/{roomId}/availability:
    get:
      operationId: getRoomAvailability
      summary: 会議室の空いている時間帯を確認する(RSV-A追記)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
          description: 空き状況を確認する会議室ID
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: 確認したい日付
      responses:
        "200":
          description: 空いている時間帯の一覧が返る(RSV-A-01〜06)。予約が一件もない日は営業時間そのもの1件、全て埋まっている日は空配列。予約可能な空きのみ(最小予約時間未満の隙間は除外、RSV-A-05)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
              example:
                roomId: room-a
                date: "2026-07-14"
                availableSlots:
                  - startTime: "09:00"
                    endTime: "10:00"
                  - startTime: "11:00"
                    endTime: "18:00"
        "404":
          description: 会議室が存在しない(RSV-A-07)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ROOM_NOT_FOUND
                message: 会議室が存在しません
  # ---- RSV-A追記ここまで ----
  # ---- ここから RSV-R追記。上のPOST /reservations・POST /reservations/{reservationId}/cancel・
  # GET /rooms/{roomId}/availabilityは無変更 ----
  /rooms/{roomId}/rules:
    get:
      operationId: getRoomReservationRules
      summary: 会議室の予約ルール(営業時間・定員・最小予約時間)を確認する(RSV-R追記)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
          description: 予約ルールを確認する会議室ID
      responses:
        "200":
          description: 予約ルールが返る(RSV-R-01/02)。営業時間・定員は会議室ごとの現在の設定、最小予約時間はシステム共通の値
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomRulesResponse"
              example:
                roomId: room-a
                businessHoursStart: "09:00"
                businessHoursEnd: "18:00"
                capacity: 6
                minReservationDurationMinutes: 30
        "404":
          description: 会議室が存在しない(RSV-R-03)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ROOM_NOT_FOUND
                message: 会議室が存在しません
  # ---- RSV-R追記ここまで ----
  # ---- ここから RSV-L追記(承認済み: 2026-07-27)。上のPOST /reservations・POST /reservations/{reservationId}/cancel・
  # GET /rooms/{roomId}/availability・GET /rooms/{roomId}/rulesは無変更 ----
  /rooms:
    get:
      operationId: listRooms
      summary: 会議室の一覧を確認する(RSV-L追記)
      responses:
        "200":
          description: 会議室の一覧が返る。並び順はname(表示名)の昇順。会議室が一件も無い場合は空配列。受け入れシナリオは実装スライスでtesterがRSV-Lとして起こす(adr/0007を参照)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListResponse"
              example:
                rooms:
                  - roomId: room-a
                    name: 会議室A
                    businessHoursStart: "09:00"
                    businessHoursEnd: "18:00"
                    capacity: 6
                  - roomId: room-b
                    name: 会議室B
                    businessHoursStart: "08:00"
                    businessHoursEnd: "20:00"
                    capacity: 10
  # ---- RSV-L追記(GET)ここまで。上のGETは無変更 ----
    # ---- ここから RSV-T追記(POST、承認待ち: ドラフト) ----
    post:
      operationId: registerRoom
      summary: 会議室を登録する(RSV-T追記)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomRegistrationRequest"
            example:
              name: 会議室C
              businessHoursStart: "09:00"
              businessHoursEnd: "18:00"
              capacity: 8
      responses:
        "201":
          description: 会議室が登録された(RSV-T-01)。roomIdはサーバ採番
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
              example:
                roomId: room-c
                name: 会議室C
                businessHoursStart: "09:00"
                businessHoursEnd: "18:00"
                capacity: 8
        "409":
          description: 同じ表示名の会議室が既に存在する(RSV-T-02)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ROOM_NAME_DUPLICATE
                message: 同じ名前の会議室が既に存在します
        "422":
          description: 営業時間が成立しない(終了時刻が開始時刻より後でない、RSV-T-03/04)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: INVALID_BUSINESS_HOURS
                message: 営業時間の終了時刻は開始時刻より後でなければなりません
  # ---- RSV-T追記(POST)ここまで ----
components:
  schemas:
    CreateReservationRequest:
      type: object
      required: [roomId, reserverId, date, startTime, endTime, attendeeCount]
      properties:
        roomId:
          type: string
          description: 会議室ID
        reserverId:
          type: string
          description: 予約する人のID
        date:
          type: string
          format: date
          description: 予約日
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 開始時刻(その日の時刻)
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 終了時刻(その日の時刻)。時間帯は半開区間で、終了時刻ちょうどは占有に含まない
        attendeeCount:
          type: integer
          minimum: 1
          description: 利用人数
    ReservationResponse:
      type: object
      required: [reservationId, roomId, reserverId, date, startTime, endTime, attendeeCount]
      properties:
        reservationId:
          type: string
        roomId:
          type: string
        reserverId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendeeCount:
          type: integer
    # ---- RSV-K追記: キャンセル用スキーマ2つ ----
    CancelReservationRequest:
      type: object
      required: [reserverId]
      properties:
        reserverId:
          type: string
          description: キャンセルを実行する人のID。予約した本人と一致しなければ403
    CancelledReservationResponse:
      type: object
      required: [reservationId, roomId, reserverId, date, startTime, endTime, attendeeCount, cancelledAt]
      properties:
        reservationId:
          type: string
        roomId:
          type: string
        reserverId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendeeCount:
          type: integer
        cancelledAt:
          type: string
          format: date-time
          description: キャンセルが実行された日時
    # ---- RSV-K追記ここまで ----
    # ---- RSV-A追記: 空き枠確認用スキーマ2つ ----
    AvailabilityResponse:
      type: object
      required: [roomId, date, availableSlots]
      properties:
        roomId:
          type: string
        date:
          type: string
          format: date
        availableSlots:
          type: array
          description: >
            空いている時間帯の一覧。開始時刻の昇順で返る。予約が一件もない日は営業時間そのもの
            1件になり、全て埋まっている日は空配列になる
          items:
            $ref: "#/components/schemas/AvailableTimeSlot"
    AvailableTimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 空いている時間帯の開始時刻
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 空いている時間帯の終了時刻。時間帯は半開区間で、終了時刻ちょうどは空き時間に含まない
    # ---- RSV-A追記ここまで ----
    # ---- RSV-R追記: 予約ルール確認用スキーマ1つ ----
    RoomRulesResponse:
      type: object
      required: [roomId, businessHoursStart, businessHoursEnd, capacity, minReservationDurationMinutes]
      properties:
        roomId:
          type: string
        businessHoursStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の開始時刻(会議室ごとの現在の設定)
        businessHoursEnd:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の終了時刻(会議室ごとの現在の設定)
        capacity:
          type: integer
          minimum: 1
          description: 定員(会議室ごとの現在の設定)
        minReservationDurationMinutes:
          type: integer
          minimum: 1
          description: 予約可能な最小時間(分)。システム共通の値で、会議室によらず同じ(RSV-C-05/RSV-A-05のルールと同一箇所を参照)
    # ---- RSV-R追記ここまで ----
    # ---- RSV-L追記(承認済み: 2026-07-27): 会議室一覧確認用スキーマ2つ ----
    RoomListResponse:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          description: >
            会議室の一覧。name(表示名)の昇順で返る。会議室が一件も登録されていない場合は空配列
          items:
            $ref: "#/components/schemas/RoomSummary"
    RoomSummary:
      type: object
      required: [roomId, name, businessHoursStart, businessHoursEnd, capacity]
      properties:
        roomId:
          type: string
          description: 会議室ID
        name:
          type: string
          description: 会議室の表示名(例"会議室A")。/rooms/{roomId}/rulesには含まれない(役割分担はadr/0007)
        businessHoursStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の開始時刻(会議室ごとの現在の設定)
        businessHoursEnd:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の終了時刻(会議室ごとの現在の設定)
        capacity:
          type: integer
          minimum: 1
          description: 定員(会議室ごとの現在の設定)
    # ---- RSV-L追記ここまで。minReservationDurationMinutesは含めない(理由はadr/0007) ----
    # ---- RSV-T追記(承認待ち: ドラフト): 会議室登録用スキーマ1つ。応答は既存RoomSummaryを再利用する ----
    RoomRegistrationRequest:
      type: object
      required: [name, businessHoursStart, businessHoursEnd, capacity]
      properties:
        name:
          type: string
          description: 会議室の表示名。既に登録されている会議室と同じ表示名は登録できない(ROOM_NAME_DUPLICATE、RSV-T-02)
        businessHoursStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の開始時刻
        businessHoursEnd:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 営業時間の終了時刻。開始時刻より後でなければならない(INVALID_BUSINESS_HOURS、RSV-T-03/04)
        capacity:
          type: integer
          minimum: 1
          description: 定員
    # ---- RSV-T追記ここまで ----
    ProblemResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            拒否理由コード。TIME_SLOT_CONFLICT(重なり) / TOO_SHORT(30分未満) /
            INVALID_TIME_SLOT(逆転・同一時刻) /
            OUTSIDE_BUSINESS_HOURS(営業時間外) / EXCEEDS_CAPACITY(定員超過) /
            NOT_RESERVER(本人以外のキャンセル) / CANCEL_DEADLINE_PASSED(開始15分前超過) /
            ALREADY_CANCELLED(キャンセル済み) / RESERVATION_NOT_FOUND(予約なし) /
            ROOM_NOT_FOUND(会議室が存在しない) / ROOM_NAME_DUPLICATE(表示名の重複) /
            INVALID_BUSINESS_HOURS(会議室の営業時間が成立しない)
            ※RSV-K改訂でキャンセル系4コードを追記(人間裁定に基づく承認済みテキストの改訂)
            ※RSV-A改訂(承認済み 2026-07-16): ROOM_NOT_FOUNDを追記。既存9コードの意味・割り当ては無変更
            ※RSV-L(承認済み 2026-07-27): 新規コードなし。GET /roomsに拒否レスポンスが無いため
            ※RSV-T(承認待ち: ドラフト): ROOM_NAME_DUPLICATE(表示名の重複)・INVALID_BUSINESS_HOURS
            (会議室の営業時間が成立しない)を追記。既存10コードの意味・割り当ては無変更
        message:
          type: string
          description: 人間が読める説明
