# 会議室予約システム API仕様 — スライスRSV-C「予約を作成できる」
# ステータス: 承認済み(2026-07-13) — このファイルがスライスRSV-Cの正式な仕様。変更には再承認が必要
# 改訂: 2026-07-14 CROSSES_DAY_BOUNDARYを削除。日マタギはスキーマ(単一date+時刻)が構造的に禁止(ADR-0004、人間承認済み)
# 改訂: 2026-07-15(承認済み) スライスRSV-K「予約をキャンセルできる」のキャンセル操作を追記(下記「RSV-K追記」ブロックと
#       paths./reservations/{reservationId}/cancel)。POST /reservationsを含む既存部分は無変更(ProblemResponse.code説明文への追記のみ人間承認済み)
# 改訂: 2026-07-16(承認済み) スライスRSV-A「空き枠を確認できる」のクエリ操作を追記(下記「RSV-A追記」ブロックと
#       paths./rooms/{roomId}/availability)。POST /reservations・POST /reservations/{reservationId}/cancelを含む
#       既存部分は無変更(ProblemResponse.code説明文へのROOM_NOT_FOUND追記のみ、人間承認済み)
# 範囲: このスライスで使う操作だけを定義する。先のスライスの分は書かない
#
# ============================================================
# 3行でわかるこの契約
#   予約する:   POST /reservations に「誰が・どの部屋を・いつ・何人で」を送る
#   成功したら: 201 と、予約ID付きの予約内容が返る
#   拒否なら:   時間帯の重なりは409、それ以外のルール違反は422。どちらも理由コード+説明文が返る
#
# リクエスト例(会議室Aを7/14の10:00-11:00に4人で予約):
#   POST /reservations
#   { "roomId": "room-a", "reserverId": "user-001", "date": "2026-07-14",
#     "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 成功レスポンス例(201):
#   { "reservationId": "rsv-123", "roomId": "room-a", "reserverId": "user-001",
#     "date": "2026-07-14", "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4 }
#
# 拒否レスポンス例(409):
#   { "code": "TIME_SLOT_CONFLICT", "message": "時間帯が既存の予約と重なっています" }
#
# 拒否理由コードとシナリオの対応:
#   TIME_SLOT_CONFLICT      … RSV-C-02(重なり) → 409
#   TOO_SHORT               … RSV-C-05(30分未満) → 422
#   INVALID_TIME_SLOT       … RSV-C-06/07(逆転・同一時刻) → 422
#   OUTSIDE_BUSINESS_HOURS  … RSV-C-08/09(営業時間外) → 422
#   EXCEEDS_CAPACITY        … RSV-C-10(定員超過) → 422
# ============================================================
#
# ---- RSV-K「予約をキャンセルできる」追記(承認済み: 2026-07-15) ----
# 4行目の要約:
#   キャンセルする: POST /reservations/{reservationId}/cancel に「誰が」(reserverId)を送る。
#                   成功は200+キャンセル後の予約内容。本人以外は403、開始15分前を過ぎていたら422、
#                   既にキャンセル済みなら409、予約が存在しなければ404
#
# リクエスト例(佐藤が予約rsv-123をキャンセル):
#   POST /reservations/rsv-123/cancel
#   { "reserverId": "user-sato" }
#
# 成功レスポンス例(200):
#   { "reservationId": "rsv-123", "roomId": "room-a", "reserverId": "user-sato",
#     "date": "2026-07-14", "startTime": "10:00", "endTime": "11:00", "attendeeCount": 4,
#     "cancelledAt": "2026-07-14T09:30:00+09:00" }
#
# 拒否レスポンス例(422、開始15分前を過ぎている場合):
#   { "code": "CANCEL_DEADLINE_PASSED", "message": "開始15分前を過ぎているためキャンセルできません" }
#
# 新しい拒否理由コードとシナリオの対応(このスライスの追加分):
#   NOT_RESERVER            … RSV-K-02(予約した本人ではない) → 403
#   CANCEL_DEADLINE_PASSED  … RSV-K-06/07(開始15分前を過ぎている) → 422
#   ALREADY_CANCELLED       … RSV-K-08(既にキャンセル済み) → 409
#   RESERVATION_NOT_FOUND   … RSV-K-09(予約が存在しない) → 404
#
# 裁定記録(2026-07-15人間裁定、詳細はprojects/reservation-system/adr/0005):
#   15分前ちょうどは可 / キャンセルは本人のみ(reserverId必須) / 二重キャンセルは409 /
#   成功は200+内容 / ProblemResponse.codeの説明文へ新コード追記(承認済みテキストの改訂を含む)
# ---- RSV-K追記ここまで ----
# ============================================================
#
# ---- RSV-A「空き枠を確認できる」追記(承認済み: 2026-07-16) ----
# 4行目の要約:
#   空き枠を確認する: GET /rooms/{roomId}/availability?date=YYYY-MM-DD を呼ぶ。
#                     成功は200+その日の空いている時間帯一覧(埋まっていれば0件もありうる)。
#                     部屋が存在しなければ404
#
# リクエスト例(会議室room-aの2026-07-14の空き枠を確認):
#   GET /rooms/room-a/availability?date=2026-07-14
#
# 成功レスポンス例(200、10:00-11:00が予約済みの場合):
#   { "roomId": "room-a", "date": "2026-07-14",
#     "availableSlots": [ { "startTime": "09:00", "endTime": "10:00" },
#                          { "startTime": "11:00", "endTime": "18:00" } ] }
#   全て埋まっている場合は "availableSlots": [] (空配列)
#   availableSlotsは「予約可能な空き」のみ。最小予約時間(30分)に満たない隙間は含まない(RSV-A-05、下記裁定)
#
# 拒否レスポンス例(404、部屋が存在しない場合):
#   { "code": "ROOM_NOT_FOUND", "message": "会議室が存在しません" }
#
# 新しい拒否理由コードとシナリオの対応(このスライスの追加分):
#   ROOM_NOT_FOUND          … RSV-A-07(会議室が存在しない) → 404
#
# 裁定記録(2026-07-16人間裁定、詳細はprojects/reservation-system/adr/0006):
#   availableSlotsは予約可能な空きのみを返す。最小予約時間(30分、RSV-C-05)未満の隙間は除外(RSV-A-05)
#
# 解釈ポイント(architectの判断。承認時に確認されたい。シナリオ側の解釈ポイントは
# contracts/reservation-availability.featureのヘッダも参照):
#   (1) このクエリは予約者の識別(reserverId等)を要求しない設計とした。空き状況の閲覧は
#       キャンセルのような資源保護の対象ではなく、公開情報として扱えると判断した
#       (ADR-0003の精神=予約者の資格・認証ルールを持たない、と整合)
#   (2) レスポンスは「空いている時間帯(availableSlots)」そのものを直接返す設計とした。
#       代替案(既存の予約=占有時間帯を返し、空き時間の計算をクライアントに委ねる)は不採用:
#       営業時間・重複判定というサーバ側の業務知識をクライアントと二重管理するリスクがあり、
#       業務文言「空き枠を確認できる」にも直接対応しない
#   (3) 1回のクエリの単位は「会議室1件×特定の1日」に限定した。複数会議室の一括確認・複数日
#       範囲確認はこのスライスでは扱わない(P-02: スライスに必要な分だけ)
#   (4) 部屋が存在しない場合のコードはROOM_NOT_FOUND。RSV-Cで実装判断として使われていた
#       (契約未定義)コード名(activeContext.md参照)を、このスライスで契約に格上げした
#   (5) availableSlotsは開始時刻の昇順で返る前提とした(スキーマのdescriptionに明記)。
#       これはシナリオのThen文が複数区間を順序付きで列挙している(RSV-A-02/03)ことと対応させるため
#
# ---- RSV-A追記ここまで ----
# ============================================================
openapi: 3.0.3
info:
  title: 会議室予約システム API
  version: 0.1.0
paths:
  /reservations:
    post:
      operationId: createReservation
      summary: 予約を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              roomId: room-a
              reserverId: user-001
              date: "2026-07-14"
              startTime: "10:00"
              endTime: "11:00"
              attendeeCount: 4
      responses:
        "201":
          description: 予約が作成された
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
              example:
                reservationId: rsv-123
                roomId: room-a
                reserverId: user-001
                date: "2026-07-14"
                startTime: "10:00"
                endTime: "11:00"
                attendeeCount: 4
        "409":
          description: 時間帯が既存の予約と重なっている(室×時間帯の排他的占有に違反)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TIME_SLOT_CONFLICT
                message: 時間帯が既存の予約と重なっています
        "422":
          description: 予約単体のルール違反(30分未満・時刻の逆転/同一・営業時間外・定員超過)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: TOO_SHORT
                message: 予約は30分以上でなければなりません
  # ---- ここから RSV-K追記。上のPOST /reservationsは無変更 ----
  /reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      summary: 予約をキャンセルする(RSV-K追記)
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
          description: キャンセル対象の予約ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationRequest"
            example:
              reserverId: user-sato
      responses:
        "200":
          description: 予約がキャンセルされた(RSV-K-01/04/05)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelledReservationResponse"
              example:
                reservationId: rsv-123
                roomId: room-a
                reserverId: user-sato
                date: "2026-07-14"
                startTime: "10:00"
                endTime: "11:00"
                attendeeCount: 4
                cancelledAt: "2026-07-14T09:30:00+09:00"
        "403":
          description: 予約した本人ではない(RSV-K-02)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: NOT_RESERVER
                message: 予約した本人のみキャンセルできます
        "404":
          description: 予約が存在しない(RSV-K-09)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: RESERVATION_NOT_FOUND
                message: 予約が存在しません
        "409":
          description: 既にキャンセルされている(RSV-K-08)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ALREADY_CANCELLED
                message: この予約は既にキャンセルされています
        "422":
          description: 開始15分前を過ぎている(RSV-K-06/07)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: CANCEL_DEADLINE_PASSED
                message: 開始15分前を過ぎているためキャンセルできません
  # ---- RSV-K追記ここまで ----
  # ---- ここから RSV-A追記。上のPOST /reservationsおよびPOST /reservations/{reservationId}/cancelは無変更 ----
  /rooms/{roomId}/availability:
    get:
      operationId: getRoomAvailability
      summary: 会議室の空いている時間帯を確認する(RSV-A追記)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
          description: 空き状況を確認する会議室ID
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: 確認したい日付
      responses:
        "200":
          description: 空いている時間帯の一覧が返る(RSV-A-01〜06)。予約が一件もない日は営業時間そのもの1件、全て埋まっている日は空配列。予約可能な空きのみ(最小予約時間未満の隙間は除外、RSV-A-05)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
              example:
                roomId: room-a
                date: "2026-07-14"
                availableSlots:
                  - startTime: "09:00"
                    endTime: "10:00"
                  - startTime: "11:00"
                    endTime: "18:00"
        "404":
          description: 会議室が存在しない(RSV-A-07)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                code: ROOM_NOT_FOUND
                message: 会議室が存在しません
  # ---- RSV-A追記ここまで ----
components:
  schemas:
    CreateReservationRequest:
      type: object
      required: [roomId, reserverId, date, startTime, endTime, attendeeCount]
      properties:
        roomId:
          type: string
          description: 会議室ID
        reserverId:
          type: string
          description: 予約する人のID
        date:
          type: string
          format: date
          description: 予約日
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 開始時刻(その日の時刻)
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 終了時刻(その日の時刻)。時間帯は半開区間で、終了時刻ちょうどは占有に含まない
        attendeeCount:
          type: integer
          minimum: 1
          description: 利用人数
    ReservationResponse:
      type: object
      required: [reservationId, roomId, reserverId, date, startTime, endTime, attendeeCount]
      properties:
        reservationId:
          type: string
        roomId:
          type: string
        reserverId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendeeCount:
          type: integer
    # ---- RSV-K追記: キャンセル用スキーマ2つ ----
    CancelReservationRequest:
      type: object
      required: [reserverId]
      properties:
        reserverId:
          type: string
          description: キャンセルを実行する人のID。予約した本人と一致しなければ403
    CancelledReservationResponse:
      type: object
      required: [reservationId, roomId, reserverId, date, startTime, endTime, attendeeCount, cancelledAt]
      properties:
        reservationId:
          type: string
        roomId:
          type: string
        reserverId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendeeCount:
          type: integer
        cancelledAt:
          type: string
          format: date-time
          description: キャンセルが実行された日時
    # ---- RSV-K追記ここまで ----
    # ---- RSV-A追記: 空き枠確認用スキーマ2つ ----
    AvailabilityResponse:
      type: object
      required: [roomId, date, availableSlots]
      properties:
        roomId:
          type: string
        date:
          type: string
          format: date
        availableSlots:
          type: array
          description: >
            空いている時間帯の一覧。開始時刻の昇順で返る。予約が一件もない日は営業時間そのもの
            1件になり、全て埋まっている日は空配列になる
          items:
            $ref: "#/components/schemas/AvailableTimeSlot"
    AvailableTimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 空いている時間帯の開始時刻
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 空いている時間帯の終了時刻。時間帯は半開区間で、終了時刻ちょうどは空き時間に含まない
    # ---- RSV-A追記ここまで ----
    ProblemResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            拒否理由コード。TIME_SLOT_CONFLICT(重なり) / TOO_SHORT(30分未満) /
            INVALID_TIME_SLOT(逆転・同一時刻) /
            OUTSIDE_BUSINESS_HOURS(営業時間外) / EXCEEDS_CAPACITY(定員超過) /
            NOT_RESERVER(本人以外のキャンセル) / CANCEL_DEADLINE_PASSED(開始15分前超過) /
            ALREADY_CANCELLED(キャンセル済み) / RESERVATION_NOT_FOUND(予約なし) /
            ROOM_NOT_FOUND(会議室が存在しない)
            ※RSV-K改訂でキャンセル系4コードを追記(人間裁定に基づく承認済みテキストの改訂)
            ※RSV-A改訂(承認済み 2026-07-16): ROOM_NOT_FOUNDを追記。既存9コードの意味・割り当ては無変更
        message:
          type: string
          description: 人間が読める説明
