# 興味の条件。ここを書き換えてcommitすると、翌朝の一覧に反映される（product-brief §2）。
# このファイルは公開リポジトリに入る。何に興味があり、どの地域を見ているかは公開される（adr/0004）。
#
# プロファイルは2種類ある（adr/0005）。
#   publishedWithinDays: N  — 昨日から遡ってN日間に「公開された」もの。開催日は問わない。新着軸
#   startsInDays / windowDays — 何日後から何日分の「開催」を見るか。リード軸
# 1つのプロファイルで両方は使えない。結果はORで1通に合流し、同じイベントは1回だけ載る。
#
# keywordsAny は「どれかを含む」の部分一致。検索対象はタイトル・キャッチ・概要・住所なので、
# 語が短いほど概要文で誤爆する（`設計` は「研修設計」「問いの設計」を拾ったため外した）。
# 地名を語に書くと住所で誤爆する——地域で絞るときは prefectures を使うこと。

profiles:
  # ---- 新着軸: 昨日公開されたものを、開催がいつであろうと拾う ----

  # AI/LLM、開発の進め方そのもの
  - keywordsAny:
      - LLM
      - 生成AI
      - AIエージェント
      - AI駆動
      - 仕様駆動
      - Claude
      - Copilot
      - コーディングエージェント
    prefectures:
      - online
    publishedWithinDays: 1

  # アーキテクチャ・設計思想
  - keywordsAny:
      - アーキテクチャ
      - 設計思想
      - ドメイン駆動
      - DDD
      - マイクロサービス
      - 技術選定
      - リファクタリング
    prefectures:
      - online
    publishedWithinDays: 1

  # クラウド
  - keywordsAny:
      - AWS
      - GCP
      - Google Cloud
      - Azure
      - Cloudflare
    prefectures:
      - online
    publishedWithinDays: 1

  # コンテナ・IaC
  - keywordsAny:
      - Docker
      - Kubernetes
      - コンテナ
      - Terraform
      - IaC
    prefectures:
      - online
    publishedWithinDays: 1

  # 言語・フレームワーク
  - keywordsAny:
      - TypeScript
      - React
      - Vue
      - C#
      - .NET
      - Java
      - Go
      - Python
    prefectures:
      - online
    publishedWithinDays: 1

  # ---- リード軸: 7〜8日後に開催されるものを思い出させる ----
  # 1日だけだと当たる曜日次第で、日曜に当たった日は2件しか返らなかった。2日にして平日を
  # 拾いやすくしている。3日にすると平日が2日入って一覧が6,000文字を超え、添付ファイルに落ちる。

  - keywordsAny:
      - LLM
      - 生成AI
      - AIエージェント
      - AI駆動
      - 仕様駆動
      - Claude
      - Copilot
      - コーディングエージェント
      - アーキテクチャ
      - 設計思想
      - ドメイン駆動
      - DDD
      - マイクロサービス
      - 技術選定
      - リファクタリング
      - AWS
      - GCP
      - Google Cloud
      - Azure
      - Cloudflare
      - Docker
      - Kubernetes
      - コンテナ
      - Terraform
      - IaC
      - TypeScript
      - React
      - Vue
      - C#
      - .NET
      - Java
      - Go
      - Python
    prefectures:
      - online
    startsInDays: 7
    windowDays: 2

  # ---- 地元: 件数が少ないので話題を絞らず、2週間先まで全部見る ----

  - prefectures:
      - toyama
    windowDays: 14
