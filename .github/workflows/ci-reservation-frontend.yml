name: CI reservation-frontend

# reservation-frontend(フロントエンド)のCIチェーン(reservation-frontend/adr/0007→0008)。
# フロントのチェーンはL1→L4(L2は既存lintの一部、L3はconsumer-driven契約に合わせてdefer)。
# バックエンドとは独立したジョブ列。
#
# meta/adr/0026 決定1.2: このプロジェクト配下(と本ワークフロー自身)が変わった時だけ起動する。
# 他プロジェクトのPRではこのチェーンは走らない。新プロジェクトは ci-<project>.yml を1本足すだけ。

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "projects/reservation-frontend/**"
      - ".github/workflows/ci-reservation-frontend.yml"
  push:
    branches: [main, develop]
    paths:
      - "projects/reservation-frontend/**"
      - ".github/workflows/ci-reservation-frontend.yml"

defaults:
  run:
    working-directory: projects/reservation-frontend

jobs:
  l1-frontend-unit-lint:
    name: "L1(frontend): 実装の内部品質(単体テスト・lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/reservation-frontend/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: lint(ESLint)
        run: npm run lint
      - name: 単体テスト(Vitest)
        run: npm run test

  l4-frontend-e2e:
    name: "L4(frontend): 仕様の充足(Playwright E2E)"
    runs-on: ubuntu-latest
    needs: l1-frontend-unit-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/reservation-frontend/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: Playwright(Chromium)ブラウザバイナリの導入
        run: npx playwright install --with-deps chromium
      - name: 本番ビルドの健全性確認(dist/にdesign-previewが含まれないこと。meta/adr/0022 §2)
        run: npm run build
      - name: E2E(受け入れシナリオの走破。contracts/*.feature = SSOT。実バックエンドは叩かない)
        run: npm run test:e2e
