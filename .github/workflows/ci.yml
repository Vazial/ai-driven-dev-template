name: CI

# L1 → L2 → L3 → L4 の順に実行する(meta/verification.md)。
# 下の段が落ちたら上の段は実行しない(needs で直列化)。
# 実コマンドはスライスRSV-C時点の構成(Java 21 / Gradle wrapper / PostgreSQL)。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: projects/reservation-system

jobs:
  # L1より前段。統治文書(ADR・friction-log・契約)の機械検証(meta/adr/0012)。
  # A層の検証であり実装スタックに依存しないため、他の段と並行に走らせる。
  govlint:
    name: "L0: 統治文書の整合(govlint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: govlint自身の単体テスト(検証ツールもテストで担保。meta/adr/0014)
        run: python -m unittest meta.tools.test_govlint
      - name: ADR・friction-log・契約IDの整合を検証
        run: python meta/tools/govlint.py
      - name: commission_design_api.pyの単体テスト(ネットワーク不使用。meta/adr/0014・0020)
        run: python -m unittest meta.tools.test_commission_design_api

  l1-unit-lint:
    name: "L1: 実装の内部品質(単体テスト・lint・mutation)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 単体テスト(domain/application)
        run: ./gradlew test --tests "reservation.domain.*" --tests "reservation.application.*"
      - name: lint
        run: ./gradlew checkstyleMain checkstyleTest checkstyleAcceptanceTest
      - name: mutation testing(PIT)
        run: ./gradlew pitest

  l2-structure:
    name: "L2: 構造の健全性(ArchUnit)"
    runs-on: ubuntu-latest
    needs: l1-unit-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 依存方向・層構造の検証
        run: ./gradlew test --tests "reservation.architecture.*"

  l3-boundary:
    name: "L3: 境界の整合(API契約・DB制約)"
    runs-on: ubuntu-latest
    needs: l2-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: API契約整合(@WebMvcTest)
        run: ./gradlew test --tests "reservation.adapter.*"
      - name: DB統合(Flyway・EXCLUDE制約・seam。Testcontainers)
        run: ./gradlew test --tests "reservation.integration.*"

  l4-acceptance:
    name: "L4: 仕様の充足(受け入れシナリオ実行)"
    runs-on: ubuntu-latest
    needs: l3-boundary
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reservation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: SUT起動(acceptanceプロファイル)
        run: |
          # ログをファイルに落とす(後段のログ清潔チェックが読む。meta/adr/0014)
          ./gradlew bootRun --args='--spring.profiles.active=acceptance' > sut.log 2>&1 &
          # 死活監視: 存在しない部屋へのGET。404(部屋なし)が返れば起動+DB到達を確認できる。
          # 404はApiExceptionHandlerが返す正常応答でありWARNを出さない(業務/seamエンドポイントを
          # 死活監視に流用しない。ボディ無しPOSTはHttpMessageNotReadableExceptionのWARNを生む)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/rooms/__readiness_probe__/rules 2>/dev/null || true)
            [ "$code" = "404" ] && break
            sleep 2
          done
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reservation
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
      - name: 受け入れシナリオ実行(contracts/ = SSOT)
        run: ./gradlew acceptanceTest
        env:
          RESERVATION_API_BASE_URL: http://localhost:8080
      - name: SUTログの清潔さを検証(WARN/ERRORが無いこと。meta/adr/0014)
        # 検証はpass/failだけでなくログの清潔さも見る。人間が目視で拾っていたWARNを機械に移す(P-01/P-10)。
        # Springログのレベル表記(前後スペースで囲まれたWARN/ERROR)のみを対象にし、Gradleの小文字warning等は拾わない。
        run: |
          if grep -nE '[[:space:]](WARN|ERROR)[[:space:]]' sut.log; then
            echo "::error::SUTログにWARN/ERRORがあります(上記)。検証インフラまたは実装の問題です"
            exit 1
          fi
          echo "SUTログはクリーン(WARN/ERRORなし)"
