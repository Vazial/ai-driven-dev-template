  l2-structure:
    name: "L2: 構造の健全性(依存関係lint等)"
    runs-on: ubuntu-latest
    needs: l1-unit-lint
    steps:
      - uses: actions/checkout@v4
      # TODO(ADR-0001後): 選定した設計パックの依存制約ルールに基づく構造検証
      - run: echo "TODO- 設計パック選定後に構造検証コマンドを追加"

  l3-boundary:
    name: "L3: 境界の整合(契約テスト等)"
    runs-on: ubuntu-latest
    needs: l2-structure
    steps:
      - uses: actions/checkout@v4
      # TODO(ADR-0001後): API仕様からの型/クライアント生成、契約テスト
