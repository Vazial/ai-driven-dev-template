name: CI

# L1 → L2 → L3 → L4 の順に実行する(meta/verification.md)。
# 下の段が落ちたら上の段は実行しない(needs で直列化)。
# 各ステップの実コマンドはスタック未選定のため TODO。ADR-0001(アーキテクチャ選定)確定後に developer/tester が埋める。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  l1-unit-lint:
    name: "L1: 実装の内部品質(単体テスト・lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(ADR-0001後): 単体テスト実行コマンド
      # TODO(ADR-0001後): lint実行コマンド
